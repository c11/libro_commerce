[package]
name = "libro_commerce"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = "0.8"
tokio = {verion="1", feature=["full"]}
sqlx = {version="0.8", features=["runtime-tokio-rustls", "postgres"]}
serde = {version="1.0", feature=["derive"]}
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber="0.3"
reqwest = {version = "0.12", features=["json"]}
jsonwebtoken = "9.3"
argon2 = "0.5"
dotenv = "0.15"
